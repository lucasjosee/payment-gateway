# Profile da demonstração. Além de ligar o stream de logs em GET /api/dev/logs (pacote devlogs), mostra o SQL que
# cada pedido executa. Aparecem só os comandos, com ? no lugar dos valores: os valores só seriam registrados no
# nível TRACE, que continua desligado.
logging:
  level:
    org.hibernate.SQL: debug
    org.springframework.jdbc.core.JdbcTemplate: debug
