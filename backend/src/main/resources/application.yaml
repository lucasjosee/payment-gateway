spring:
  application:
    name: gateway
  autoconfigure:
    # Sem isto, o Spring Boot cria um usuário "user" com senha aleatória, pensado para login com usuário e senha.
    # A API só autentica por API key, então esse usuário seria uma credencial sobrando.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    # Os valores padrão só servem para rodar local com o docker-compose. Em qualquer outro ambiente, essas três variáveis precisam estar definidas.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gateway}
    username: ${DB_USERNAME:gateway}
    password: ${DB_PASSWORD:gateway}
  jpa:
    hibernate:
      # Quem cria e altera tabelas é o Flyway. O Hibernate só confere se as entidades batem com o banco
      # e impede a aplicação de subir se houver diferença.
      ddl-auto: validate
  web:
    # Fixa o idioma das mensagens de validação. Sem isso, elas seguiriam o idioma da máquina ou o
    # Accept-Language do cliente, e a API responderia em português aqui e em inglês na EC2.
    locale: pt-BR
    locale-resolver: fixed

springdoc:
  # O Swagger fica ligado de propósito em todo ambiente, inclusive na EC2, porque é a vitrine do projeto.
  # Ele mostra quais rotas existem, mas não dá acesso a nada: as rotas com cadeado continuam exigindo a chave.
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  # Os controllers não declaram o formato da resposta, e sem isto o Swagger mostraria */* em vez de JSON.
  default-produces-media-type: application/json
