server:
  servlet:
    # Todas as rotas, inclusive o actuator e o Swagger, passam a começar com /api. O front vai ficar no mesmo domínio
    # da API, e é por esse prefixo que quem fica na frente dos dois (o Vite em desenvolvimento, o CloudFront na AWS)
    # decide para onde mandar cada pedido. O prefixo só aparece aqui: controllers e SecurityConfig usam as rotas sem ele.
    context-path: /api

logging:
  pattern:
    # Acrescenta ao formato padrão do Spring Boot, antes do nome da classe, o ID do pedido (posto pelo RequestIdFilter)
    # e o lojista (posto pelo ApiKeyAuthenticationFilter). O "-" aparece quando o valor não existe, como nas linhas da
    # inicialização ou num pedido sem API key válida.
    correlation: "[req=%X{requestId:--} merchant=%X{merchantId:--}] "

spring:
  application:
    name: gateway
  autoconfigure:
    # Sem isto, o Spring Boot cria um usuário "user" com senha aleatória, pensado para login com usuário e senha.
    # A API só autentica por API key, então esse usuário seria uma credencial sobrando.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    # Os valores padrão só servem para rodar local com o docker-compose. Em qualquer outro ambiente, essas três variáveis precisam estar definidas.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gateway}
    username: ${DB_USERNAME:gateway}
    password: ${DB_PASSWORD:gateway}
  jpa:
    # Ligado, que é o padrão do Spring Boot, o EntityManager fica aberto até o fim da requisição e segura a
    # conexão com o banco mesmo depois de a transação terminar. Quando um pedido falha, o IdempotencyService
    # libera a chave usando outra conexão, então cada pedido com erro passa a precisar de duas. Com vários falhando
    # ao mesmo tempo, todos ficam com uma e esperando a segunda, até o pool estourar o tempo limite.
    # Desligado, tudo o que vem do banco precisa ser lido dentro da transação, como o ChargeService já faz.
    open-in-view: false
    hibernate:
      # Quem cria e altera tabelas é o Flyway. O Hibernate só confere se as entidades batem com o banco
      # e impede a aplicação de subir se houver diferença.
      ddl-auto: validate
  web:
    # Fixa o idioma das mensagens de validação. Sem isso, elas seguiriam o idioma da máquina ou o
    # Accept-Language do cliente, e a API responderia em português aqui e em inglês na EC2.
    locale: pt-BR
    locale-resolver: fixed

gateway:
  # Chave do HMAC que gera o card_fingerprint. Assim como as do banco, o valor padrão só serve para rodar local.
  # Fora daqui a variável precisa estar definida, porque com o banco e esta chave em mãos dá para testar números
  # de cartão até achar o de cada cobrança. Trocar a chave depois faz o antifraude não reconhecer cartões antigos.
  card-fingerprint-key: ${CARD_FINGERPRINT_KEY:dev-only-card-fingerprint-key}
  # Chave do HMAC que gera o request_hash das Idempotency-Keys. Pelo mesmo motivo da chave acima, fora daqui ela
  # precisa estar definida. Trocá-la tem pouco efeito: por até 24 horas, repetir um pedido antigo dá 422 em vez de
  # devolver a resposta guardada.
  idempotency-hash-key: ${IDEMPOTENCY_HASH_KEY:dev-only-idempotency-hash-key}

springdoc:
  # O Swagger fica ligado de propósito em todo ambiente, inclusive na EC2, porque é a vitrine do projeto.
  # Ele mostra quais rotas existem, mas não dá acesso a nada: as rotas com cadeado continuam exigindo a chave.
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  # Os controllers não declaram o formato da resposta, e sem isto o Swagger mostraria */* em vez de JSON.
  default-produces-media-type: application/json
